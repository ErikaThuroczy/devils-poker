<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DEVils Poker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">

<style>
:root{--bg:#0b0402;--ink:#FFF2D8;--dim:#d2b998;--lbl:#d9b98f;--amber:#ffaa2b;
 --gothic:"Pirata One","Palatino Linotype",Georgia,serif;
 --body:"MedievalSharp",Georgia,"Times New Roman",serif;--cin:"Cinzel",Georgia,serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.4;-webkit-font-smoothing:antialiased;
 background-color:var(--bg);background-image:radial-gradient(circle at 50% 12%,#ff78141f 0,transparent 60%),radial-gradient(circle at 10% 90%,#b414141a 0,transparent 45%),radial-gradient(circle at 90% 90%,#781eb414 0,transparent 45%),linear-gradient(180deg,#090302,#120704 35%,#0d0503 70%,#070202)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 20px #000b,inset 0 0 35px 2px #ff3c0026}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #ffe082;outline-offset:3px}
.wrap{position:relative;max-width:1280px;margin:0 auto;padding:16px 20px 18px}
h1{font-family:var(--gothic);font-weight:400;font-size:clamp(2.2rem,5vw,3.2rem);line-height:1;margin:0;letter-spacing:.02em;text-shadow:0 4px 10px #000e}
.tag{font-family:var(--cin);font-weight:700;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#ff7a80;border:1px solid #d92c3480;background:#450a0d99;border-radius:4px;padding:2px 7px}
.sub{margin:4px 0 0;color:var(--dim)}
.sub b{color:var(--amber);text-decoration:underline wavy #ffaa2b80;text-underline-offset:4px}
.rank{font-family:var(--cin);font-size:.78rem;color:#c9a17f}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px}
.head.center{justify-content:center;text-align:center}
.head.center .brand{justify-content:center}
.brand{display:flex;align-items:center;gap:12px}
.titlerow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.seal{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7a1216,#330807 55%,#120302);border:2px solid #ffaa2b99;box-shadow:0 0 16px #e6282880}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:236px;min-height:48px;padding:0 16px;border-radius:8px;font-size:1.08rem;letter-spacing:.02em;transition:border-color .2s,box-shadow .2s,transform .1s}
.btn:active{transform:scale(.97)}
.btn .pill{font-family:var(--cin);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.btn.inv{background:linear-gradient(#2a170f,#150a06);border:1px solid #784126;color:#f2dfc7;box-shadow:0 4px 12px #0009}
.btn.inv:hover{border-color:#ff9d2e}
.btn.inv .pill{border:1px solid #7a4a2e;background:#100603;color:#e0bd9c}
.btn.rev{background:linear-gradient(#d9232c,#a8141b 50%,#6b090e);border:1px solid #ff6666b3;color:#fff7f4;font-weight:700;box-shadow:0 0 24px #d9232c99;text-shadow:0 2px 4px #000c}
.btn.rev:hover{border-color:#ffa3a3;box-shadow:0 0 34px #f02832d9}
.btn.rev .pill{background:#400508cc;border:1px solid #ff707060;color:#ffc9a0;font-weight:400}
.btn[disabled]{opacity:.5;cursor:default;box-shadow:none}
.btn.ready{animation:ready 1.2s ease-in-out infinite alternate}
@keyframes ready{to{box-shadow:0 0 38px 6px #ff2b3dcc}}
.err{background:#3a0d10;border:1px solid #ff2b3d;border-radius:8px;padding:10px 14px;margin:12px 0}
.coven{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:14px;padding-top:10px;border-top:1px solid #31170d}
.covenl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.people{display:flex;flex-wrap:wrap;align-items:center;gap:8px;list-style:none;margin:0;padding:0}
.lbl{font-family:var(--cin);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lbl)}
.chip{display:flex;align-items:center;gap:8px;padding:3px 12px;min-height:30px;border-radius:999px;border:1px solid #6a3a22;background:#140804;color:#e6d0b8;font-size:.92rem}
.chip em{font-style:normal;color:#cfae94;font-size:.85rem}
.chip.done{border-color:#d97c36;background:#221008;color:#edd9c2}
.chip.done em{color:#86efac}
.chip.me{border-color:var(--amber);background:linear-gradient(90deg,#381c0c,#1c0c05);color:#ffd99f}
.chip .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #b08a70;flex:none}
.chip.done .dot{background:#22c55e;border-color:#22c55e;box-shadow:0 0 6px #22c55e}
.chip .x{min-width:24px;min-height:24px;background:none;border:0;border-radius:50%;color:#cfae94;font-size:1.1rem;line-height:1}
.chip .x:hover{color:#ff6b72;background:#ffffff14}
.counts{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--cin);font-size:.8rem;letter-spacing:.05em;color:#dfb98d}
.counts strong{color:var(--amber)}
.burn{position:relative;margin:48px 0 24px;height:22px}
.track{position:absolute;inset:auto 0 0 0;height:22px;background:#0c0405;border:1px solid #5a2c1a;border-radius:4px;overflow:visible}
.fill{position:absolute;left:0;bottom:0;height:100%;border-radius:3px;transition:width .6s ease;background:linear-gradient(90deg,#7a0d12,#d1272a 35%,#e8611f 70%,#f2a341);box-shadow:0 0 18px 2px #e8611f99;animation:glow 1.4s ease-in-out infinite alternate}
.flames{position:absolute;left:0;right:0;bottom:100%;height:0;display:flex;justify-content:space-around;align-items:flex-end}
.flames i{display:block;width:16px;height:26px;margin-bottom:-2px;border-radius:50% 50% 20% 20%/80% 80% 20% 20%;transform-origin:50% 100%;background:linear-gradient(0deg,#e8611f,#f2a341 60%,#ffe9a8);animation:lick .9s ease-in-out infinite}
.flames i:nth-child(3n){animation-duration:.7s;height:34px}
.flames i:nth-child(3n+1){animation-delay:-.35s;height:22px}
.flames i:nth-child(3n+2){animation-delay:-.6s}
@keyframes lick{0%,100%{transform:scaleY(.75) skewX(-4deg)}50%{transform:scaleY(1.15) skewX(5deg)}}
@keyframes glow{from{filter:brightness(.92)}to{filter:brightness(1.2)}}
.deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (min-width:560px){.deck{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.deck{--h:calc((100vh - 375px) / 2);grid-template-columns:repeat(6,minmax(0,1fr));margin-left:auto;margin-right:auto;max-width:max(700px,calc(6 * var(--h) * .674 + 60px))}}
.pc{--t:#ffaa2b;--bd:#bd6e1a;--tag:#e0a860;container-type:inline-size;position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;aspect-ratio:172/255;padding:10px 10px 9px;text-align:left;border-radius:14px;border:1.5px solid var(--bd);
 background:radial-gradient(circle at 50% 30%,#20100a,#140905 70%,#0d0402);color:var(--t);box-shadow:0 4px 18px #000d,inset 0 0 12px color-mix(in srgb,var(--bd) 25%,transparent);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.pc.t-crimson{--t:#ff4d55;--bd:#a32228;--tag:#ff8a90}
.pc.t-void{--t:#c084fc;--bd:#7c2d9e;--tag:#d3adfa}
.pc::before{content:"";position:absolute;inset:6px;border:1px dashed color-mix(in srgb,var(--bd) 50%,transparent);border-radius:9px;pointer-events:none}
.pc::after{content:"";position:absolute;inset:3px;pointer-events:none;opacity:.85;background-repeat:no-repeat;
 background-image:linear-gradient(var(--t),var(--t)),linear-gradient(var(--t),var(--t)),linear-gradient(var(--t),var(--t)),linear-gradient(var(--t),var(--t)),linear-gradient(var(--t),var(--t)),linear-gradient(var(--t),var(--t)),linear-gradient(var(--t),var(--t)),linear-gradient(var(--t),var(--t));
 background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;background-size:12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px}
.pc>*{position:relative;z-index:1}
button.pc:hover{transform:translateY(-6px) scale(1.015);border-color:var(--t);box-shadow:0 8px 28px color-mix(in srgb,var(--t) 35%,transparent),inset 0 0 16px color-mix(in srgb,var(--t) 25%,transparent)}
.pc.sel{--bd:var(--t);border-width:2px;border-color:var(--t);background:radial-gradient(circle at 50% 25%,color-mix(in srgb,var(--t) 20%,#1a0b06),#100502 70%);transform:translateY(-4px) scale(1.02);animation:aura 3s infinite alternate ease-in-out}
button.pc.sel:hover{transform:translateY(-4px) scale(1.02)}
@keyframes aura{from{box-shadow:0 0 24px color-mix(in srgb,var(--t) 50%,transparent),inset 0 0 16px color-mix(in srgb,var(--t) 28%,transparent)}to{box-shadow:0 0 42px color-mix(in srgb,var(--t) 80%,transparent),0 0 18px var(--t),inset 0 0 26px color-mix(in srgb,var(--t) 40%,transparent)}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.num{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.n{font-family:var(--gothic);font-size:clamp(1.5rem,19cqw,2.5rem);line-height:1;-webkit-text-stroke:.8px currentColor;text-shadow:0 2px 4px #000c}
.tagicon{width:1.6rem;height:1.6rem;display:block}
.rune{font-family:var(--cin);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tag);text-align:right;line-height:1.2;padding-top:3px}
@container (max-width:135px){.rune{display:none}}
.art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 0}
.ill{height:100%;width:auto;max-width:82%;aspect-ratio:1}
.cap{display:flex;align-items:flex-start;justify-content:center;min-height:4.7em;padding-top:6px;text-align:center;text-wrap:balance;font-size:clamp(.72rem,8cqw,.95rem);line-height:1.18;font-weight:700;color:var(--ink);text-shadow:0 1px 2px #000e}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid #31160c;color:#d6b797;font-size:.95rem}
.foot span{color:var(--amber)}
.stage{text-align:center;padding-top:14px}
.verdict{margin:0 auto 26px;max-width:680px}
.verdict .big{font-family:var(--gothic);font-size:clamp(2.4rem,8vw,4rem);line-height:1.05;margin:0;color:var(--ink);text-shadow:0 0 28px #e8611f88}
.verdict p{margin:10px 0 0;color:var(--dim);font-size:1.15rem}
.verdict p.big{margin:0;color:var(--ink)}
.faces{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 18px}
.face{width:clamp(150px,22vw,200px)}
.face.solo{width:clamp(190px,36vw,270px)}
.face .pc{animation:flip .55s ease-out both;animation-delay:calc(var(--i) * 110ms)}
@keyframes flip{from{transform:perspective(700px) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.who{margin-top:12px;font-size:1.1rem}
.hint{color:var(--dim);margin:14px 0 0}
.landing{text-align:center;padding-top:9vh}
.landing .brand{justify-content:center;margin-bottom:12px}
.landing .btn{margin-top:22px}

.rules{max-width:640px;margin:34px auto 0;text-align:left;border-top:1px solid #31170d;padding-top:22px}
.rules h2{font-family:var(--gothic);font-weight:400;font-size:1.5rem;margin:0 0 8px;text-align:center}
.rules .lede{color:var(--dim);text-align:center;margin:0 0 18px;font-size:1rem}
.rules ol{margin:0;padding:0 0 0 1.4em;color:var(--ink);font-size:.98rem;line-height:1.55}
.rules li{margin-bottom:6px}
.rules li b{color:var(--amber)}

[class*="anim-"]{transform-box:fill-box;transform-origin:50% 50%}
@keyframes magmaPulse{0%,100%{filter:drop-shadow(0 0 3px #ff3b00) drop-shadow(0 0 7px #ff8c00);stroke:#ff7700;opacity:.85}50%{filter:drop-shadow(0 0 6px #ffedd5) drop-shadow(0 0 14px #ff3700);stroke:#fff4cc;opacity:1}}
.anim-magma-pulse{animation:magmaPulse 2.4s infinite ease-in-out}
@keyframes emberDrift{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}80%{opacity:.8}100%{transform:translate(var(--dx,-4px),-18px) scale(1.1);opacity:0}}
.anim-ember-1{animation:emberDrift 2.2s infinite ease-out;--dx:-3px}
.anim-ember-2{animation:emberDrift 2.8s infinite ease-out .8s;--dx:4px}
.anim-ember-3{animation:emberDrift 1.9s infinite ease-out 1.3s;--dx:-1px}
@keyframes flameFlicker{0%,100%{transform:scaleY(1)}33%{transform:scaleY(1.1) scaleX(.94) skewX(2deg)}66%{transform:scaleY(.94) scaleX(1.05) skewX(-2deg)}}
.anim-inferno-flames{animation:flameFlicker 1.4s infinite alternate ease-in-out;transform-origin:50% 100%}
@keyframes sip{0%,60%,100%{transform:translateY(0) rotate(0)}75%{transform:translateY(-.8px) rotate(-1.5deg)}}
.anim-calm-sipper{animation:sip 4s infinite ease-in-out;transform-origin:50% 100%}
@keyframes fumeRise{0%{transform:translateY(0) scaleX(.8);opacity:.15}50%{transform:translateY(-4px) scaleX(1.1);opacity:.65}100%{transform:translateY(-9px) scaleX(1.3);opacity:0}}
.anim-mug-steam{animation:fumeRise 2.6s infinite ease-in-out}
@keyframes pulseGlow{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
.anim-husk-glow{animation:pulseGlow 3s infinite ease-in-out}
.anim-soul-core{animation:pulseGlow 2.4s infinite ease-in-out}
@keyframes infuse{0%{transform:translateY(-4px);opacity:0}50%{opacity:1}100%{transform:translateY(3px);opacity:0}}
.anim-soul-infusion{animation:infuse 2.6s infinite ease-in}
@keyframes phaseGlyph{0%,100%{opacity:.35;transform:translateY(0) scale(.92)}50%{opacity:1;transform:translateY(-3px) scale(1.1)}}
.anim-trail-q1{animation:phaseGlyph 2.5s infinite ease-in-out}
.anim-trail-q2{animation:phaseGlyph 2.9s infinite ease-in-out 1.2s}
.anim-trail-q3{animation:phaseGlyph 2.2s infinite ease-in-out .6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.anim-dev-flee{animation:bob .5s infinite ease-in-out}
@keyframes flap{0%,100%{transform:skewX(0)}50%{transform:skewX(-6deg)}}
.anim-coat-trail{animation:flap .6s infinite ease-in-out;transform-origin:100% 50%}
@keyframes puff{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.anim-dust-puff{animation:puff 1.2s infinite ease-out}
button.seal{cursor:pointer;padding:0;color:#d9b98f;transition:box-shadow .2s,color .2s,border-color .2s}
button.seal:hover{border-color:#ffaa2b}
button.seal[aria-pressed="true"]{color:#ffaa2b;box-shadow:0 0 22px #ffaa2bb0;animation:sealbeat 1.2s ease-in-out infinite alternate}
@keyframes sealbeat{to{box-shadow:0 0 32px #ffaa2b}}
.seal svg{width:50%;height:50%}
.sp{position:fixed;right:16px;bottom:16px;z-index:30;width:min(300px,calc(100vw - 32px));border-radius:12px;overflow:hidden;box-shadow:0 8px 30px #000c;visibility:hidden;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s,visibility .25s}
.sp.show{visibility:visible;opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

const CUP = "<svg class=\"tagicon\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\"> <path d=\"M18 8h1a4 4 0 0 1 0 8h-1\"></path> <path d=\"M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z\"></path> <line x1=\"6\" x2=\"6\" y1=\"1\" y2=\"4\"></line> <line x1=\"10\" x2=\"10\" y1=\"1\" y2=\"4\"></line> <line x1=\"14\" x2=\"14\" y1=\"1\" y2=\"4\"></line> </svg>";

/* ---------- ntfy.sh event log (no signup, browser-friendly) ---------- */
const NTFY = "https://ntfy.sh/";
const topicOf = sid => "devils-poker-" + sid;
const rid = () => Math.random().toString(36).slice(2, 10);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// Everyone replays the same events in the same order, so everyone sees the same state.
function reduce(events) {
  const s = { round: 1, revealed: false, participants: {} };
  const ps = s.participants;
  for (const e of events) {
    if (e.t === "join" && !ps[e.id]) {
      const used = new Set(Object.values(ps).map(p => p.name));
      let name = e.name;
      while (used.has(name)) name += " II";
      ps[e.id] = { name, vote: null };
    } else if (e.t === "vote" && ps[e.id] && e.r === s.round && !s.revealed) {
      ps[e.id].vote = e.v;
    } else if (e.t === "reveal" && e.r === s.round) {
      s.revealed = true;
    } else if (e.t === "new" && e.r === s.round) {
      s.round++; s.revealed = false;
      Object.values(ps).forEach(p => { p.vote = null; });
    } else if (e.t === "leave") {
      delete ps[e.id];
    }
  }
  return s;
}

function identity(sid) {
  const key = "devils:" + sid;
  let ident = store.get(key);
  if (!ident) {
    ident = { id: "c" + rid(), name: NAMES[Math.floor(Math.random() * NAMES.length)] };
    store.set(key, ident);
  }
  return ident;
}

function Game({ music }) {
  const [sid, setSid] = useState(() => new URLSearchParams(location.search).get("s"));
  const [events, setEvents] = useState([]);
  const [conn, setConn] = useState("connecting");
  const [copied, setCopied] = useState(false);
  const busy = false;
  const me = useMemo(() => (sid ? identity(sid) : null), [sid]);
  const session = useMemo(() => reduce(events), [events]);
  const err = conn === "down"
    ? "Can't reach ntfy.sh. Check your connection or ad blocker. The app keeps retrying." : null;

  const link = sid ? `${location.origin}${location.pathname}?s=${sid}` : "";

  const send = ev => fetch(NTFY + topicOf(sid), {
    method: "POST", body: JSON.stringify({ ...ev, eid: rid() }),
  }).catch(() => setConn("down"));

  function summon() {
    const id = rid() + rid();
    history.replaceState(null, "", `?s=${id}`);
    setSid(id);
  }

  // live stream: replays the whole session log, then stays open
  useEffect(() => {
    if (!sid) return;
    const seen = new Set();
    const es = new EventSource(`${NTFY}${topicOf(sid)}/sse?since=all`);
    es.onopen = () => { setConn("live"); send({ t: "join", id: me.id, name: me.name }); }; // ignored if already joined
    es.onerror = () => setConn("down");
    es.onmessage = m => {
      try {
        const d = JSON.parse(m.data);
        if (d.event && d.event !== "message") return;
        const ev = JSON.parse(d.message);
        if (!ev.eid || seen.has(ev.eid)) return;
        seen.add(ev.eid);
        setEvents(prev => [...prev, ev]);
      } catch {}
    };
    return () => es.close();
  }, [sid]);

  // self-heal: if our own join never made it into the shared log
  // (e.g. published a beat before our subscription was live), keep
  // resending it until we actually see ourselves in the replayed state.
  const partsRef = useRef({});
  partsRef.current = session.participants;
  useEffect(() => {
    if (!sid || !me) return;
    const t = setInterval(() => {
      if (!partsRef.current[me.id]) send({ t: "join", id: me.id, name: me.name });
    }, 2500);
    return () => clearInterval(t);
  }, [sid, me]);

  const vote = v => { if (!session.revealed) send({ t: "vote", id: me.id, v, r: session.round }); };
  const reveal = () => send({ t: "reveal", r: session.round });
  const newRound = () => send({ t: "new", r: session.round });
  const banish = id => send({ t: "leave", id });
  async function copy() {
    try { await navigator.clipboard.writeText(link); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch {}
  }

  /* ---------- landing ---------- */
  if (!sid) {
    return (
      <main className="wrap landing">
        <div className="brand">
          <MusicToggle music={music} />
          <div className="titlerow"><h1>DEVils Poker</h1><span className="tag">Estimation Grimoire</span></div>
        </div>
        <p className="sub">Estimate at your own risk. No refunds, no story points held sacred.</p>
        <button type="button" className="btn rev" onClick={summon}><span>Start a session</span></button>
        <p className="sub" style={{ marginTop: 16 }}>You'll get a link to share. Everyone who opens it joins as a random devil.</p>
        {err && <div className="err" role="alert">{err}</div>}

        <div className="rules">
          <h2>Why this exists</h2>
          <p className="lede">
            Standups became status meetings. Retros produce the same three sticky notes every
            two weeks. Story points get converted back into hours anyway. The numbers were
            always made up &mdash; so now they're made up by devils.
          </p>
          <ol>
            <li>Open the link. You're auto-assigned a <b>random devil name</b>. No login, no accounts.</li>
            <li>Read the ticket. Pick the card that best captures your dread.</li>
            <li>Change your mind as often as you like &mdash; nothing is shown until someone reveals.</li>
            <li>Once the coven has voted, hit <b>Reveal Votes</b>. Matching votes group into one card.</li>
            <li>Disagreement? Talk it through, then start a <b>new round</b> and vote again.</li>
          </ol>
        </div>
      </main>
    );
  }

  /* ---------- session ---------- */
  const parts = Object.entries(session.participants);
  const total = parts.length;
  const voted = parts.filter(([, p]) => p.vote != null).length;
  const denom = Math.max(EXPECTED, total);
  const pct = Math.round((voted / denom) * 100);
  const everyone = total > 1 && voted === total;
  const sel = session.participants[me.id]?.vote;
  const flames = Math.round(pct / 100 * 14);

  const invite = (
    <button type="button" className="btn inv" onClick={copy}>
      <span aria-hidden="true">✦</span><span>{copied ? "Link copied" : "Invite the coven"}</span>
      <span className="pill" aria-label={`${total} of ${EXPECTED} joined`}>{total}/{EXPECTED}</span>
    </button>
  );

  return (
    <div className="wrap">
      <header className={"head" + (session.revealed ? " center" : "")}>
        <div className="brand">
          <MusicToggle music={music} />
          <div>
            <div className="titlerow"><h1>DEVils Poker</h1><span className="tag">Estimation Grimoire</span></div>
            <p className="sub">Round {session.round}, you are <b>{session.participants[me.id]?.name || me.name}</b> <span className="rank">[Archdevil of Sprints]</span></p>
          </div>
        </div>
        {!session.revealed && (
          <div className="acts">
            {invite}
            <button type="button" className={"btn rev" + (everyone ? " ready" : "")} onClick={reveal} disabled={voted === 0}>
              <span>Reveal Votes</span><span className="pill">Unseal</span>
            </button>
          </div>
        )}
      </header>
      {err && <div className="err" role="alert">{err}</div>}

      <main>
        {session.revealed ? <Reveal session={session} me={me} onNew={newRound} invite={invite} /> : (<>
          <div className="coven">
            <div className="covenl">
              <span className="lbl">❖ The coven:</span>
              <ul className="people">
                {parts.map(([id, p]) => (
                  <li key={id} className={"chip" + (id === me.id ? " me" : "") + (p.vote != null ? " done" : "")}>
                    <span className="dot" aria-hidden="true" />
                    <span>{p.name} <em>({id === me.id ? "you, " : ""}{p.vote != null ? "voted" : "pondering…"})</em></span>
                    {p.vote == null && id !== me.id && (
                      <button type="button" className="x" title={`Banish ${p.name}`} aria-label={`Banish ${p.name}`} onClick={() => banish(id)}>×</button>
                    )}
                  </li>
                ))}
              </ul>
            </div>
            <div className="counts" role="status" aria-live="polite">
              <span><strong>{voted} of {denom}</strong> souls cast</span><span aria-hidden="true">•</span>
              <span><strong>{total} of {denom}</strong> in chamber</span>
            </div>
          </div>

          <div className="burn">
            <div className="track" role="progressbar" aria-label="Votes cast" aria-valuemin={0} aria-valuemax={denom} aria-valuenow={voted}>
              <div className="fill" style={{ width: pct + "%" }}>
                <div className="flames" aria-hidden="true">{Array.from({ length: flames }, (_, i) => <i key={i} />)}</div>
              </div>
            </div>
          </div>

          <div className="deck" role="group" aria-label="Estimate cards">
            {DECK.map(([v]) => <Card key={v} v={v} sel={sel === v} onClick={() => vote(v)} />)}
          </div>
        </>)}
      </main>
      {!session.revealed && <footer className="foot"><span aria-hidden="true">❖ </span>Pick a card. Pick another to change your mind. The veil remains unsevered until someone reveals.</footer>}
    </div>
  );
}

function Card({ v, sel, onClick }) {
  const Tag = onClick ? "button" : "div";
  return (
    <Tag className={"pc t-" + tierOf(v) + (sel ? " sel" : "")} onClick={onClick} type={onClick ? "button" : undefined}
      aria-pressed={onClick ? !!sel : undefined} aria-label={`${v === "☕" ? "Coffee" : v}: ${CARD[v].c}`}>
      <span className="top">
        <span className="num">
          <span className="n">{v === "☕" ? <span dangerouslySetInnerHTML={{ __html: CUP }} /> : v}</span>
        </span>
        <span className="rune">{TAGS[v]}</span>
      </span>
      <span className="art" dangerouslySetInnerHTML={{ __html: ART[v] }} />
      <span className="cap">{CARD[v].c}</span>
    </Tag>
  );
}

const ORDER = v => (/^\d+$/.test(v) ? Number(v) : v === "☕" ? 1000 : 1001);

function Reveal({ session, me, onNew, invite }) {
  const all = Object.entries(session.participants);
  const cast = all.filter(([, p]) => p.vote != null).sort((a, b) => ORDER(a[1].vote) - ORDER(b[1].vote));
  const missing = all.filter(([, p]) => p.vote == null).map(([, p]) => p.name);
  const vals = [...new Set(cast.map(([, p]) => p.vote))];
  const nums = cast.map(([, p]) => p.vote).filter(v => /^\d+$/.test(v)).map(Number);
  const lo = Math.min(...nums), hi = Math.max(...nums);

  let head, note;
  if (!cast.length) { head = "Nobody voted"; note = "Start a new round and pick a card."; }
  else if (vals.length === 1) { head = `Agreed: ${vals[0] === "☕" ? "coffee" : vals[0]}`; note = cast.length > 1 ? "The whole coven agrees." : "Just you so far."; }
  else {
    head = "No agreement yet";
    const bits = [lo < hi
      ? `Votes run from ${lo} to ${hi}. Ask the highest and lowest voters to explain, then vote again.`
      : "Talk it through, then vote again."];
    if (vals.includes("?") || vals.includes("☕")) bits.push("Someone needs more info first.");
    note = bits.join(" ");
  }

  return (
    <div className="stage">
      <div className="verdict" role="status"><p className="big">{head}</p><p>{note}</p></div>
      <div className="faces">
        {vals.map((v, i) => (
          <div key={v} className={"face" + (vals.length === 1 ? " solo" : "")} style={{ "--i": i }}>
            <Card v={v} />
            <div className="who">
              {cast.filter(([, p]) => p.vote === v).map(([id, p]) => p.name + (id === me.id ? " (you)" : "")).join(", ")}
            </div>
          </div>
        ))}
      </div>
      {missing.length > 0 && <p className="hint">Didn't vote: {missing.join(", ")}</p>}
      <div className="acts" style={{ justifyContent: "center", marginTop: 32 }}>
        <button type="button" className="btn rev" onClick={onNew}><span>New round</span></button>
        {invite}
      </div>
    </div>
  );
}

const TRACK = "spotify:track:5uP1WWp6LRSNUNvmzANBOK"; // Spooky, Scary Skeletons (Andrew Gold)

// Spotify's player is only loaded once someone switches the music on.
function useMusic() {
  const [on, setOn] = useState(false);
  const host = useRef(null);
  const ctl = useRef(null);
  const want = useRef(false);
  function toggle() {
    const next = !on;
    want.current = next;
    setOn(next);
    if (ctl.current) { next ? ctl.current.play() : ctl.current.pause(); return; }
    if (!next || document.getElementById("sp-api")) return;
    window.onSpotifyIframeApiReady = api => {
      api.createController(host.current, { uri: TRACK, width: "100%", height: 80 }, c => {
        ctl.current = c;
        c.addListener("ready", () => { if (want.current) c.play(); });
        c.addListener("playback_update", e => {
          const d = e.data || {};
          // loop the track while music is on
          if (want.current && d.isPaused && d.duration && d.position >= d.duration - 1000) { try { c.seek(0); c.resume(); } catch {} }
        });
      });
    };
    const sc = document.createElement("script");
    sc.id = "sp-api"; sc.src = "https://open.spotify.com/embed/iframe-api/v1"; sc.async = true;
    sc.onerror = () => { want.current = false; setOn(false); sc.remove(); };
    document.body.appendChild(sc);
  }
  return { on, toggle, host };
}

function MusicToggle({ music }) {
  const { on, toggle } = music;
  return (
    <button type="button" className="seal" onClick={toggle} aria-pressed={on}
      aria-label={on ? "Turn music off" : "Turn music on"} title={on ? "Music on: Spooky, Scary Skeletons" : "Music off"}>

        // assembled: skull grinning over crossbones, mid-jig

          <circle cx="10.3" cy="7" r="0.85" fill="currentColor" stroke="none" />
          <circle cx="13.7" cy="7" r="0.85" fill="currentColor" stroke="none" />
          <path d="M11.1 9.6l0.9 1.1 0.9-1.1" />
          <path d="M9.6 10.7h4.8" />
          <path d="M5 20l6.2-6.2M19 20l-6.2-6.2" />
          <path d="M5 20l2-.6M19 20l-2-.6M11.2 13.8l-.6-2M12.8 13.8l.6-2" />

        // fallen apart: same skull, toppled, bones scattered
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <g transform="rotate(-18 8.4 8)">
            <circle cx="8.4" cy="8" r="3.4" />
            <circle cx="7.1" cy="7.5" r="0.7" fill="currentColor" stroke="none" />
            <circle cx="9.7" cy="7.5" r="0.7" fill="currentColor" stroke="none" />
            <path d="M7.3 10.2h2.2" />
          </g>
          <path d="M12.5 15l5.5 4.2" />
          <path d="M12.5 19.2l1.6-.9M17 19.2l1.5-1" />
          <path d="M17.3 5.6l2.4 1.6M19.7 7.2l-.7 2" />
          <circle cx="4.5" cy="16.5" r="0.75" fill="currentColor" stroke="none" />
        </svg>
      )}
    </button>
  );
}

function App() {
  const music = useMusic();
  return (
    <>
      <Game music={music} />
      <div className={"sp" + (music.on ? " show" : "")}><div ref={music.host} /></div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
